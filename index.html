<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to BGTF</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2.5rem;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.08);
            border-color: #0366d6;
        }
        .card h2 {
            margin-top: 0;
            color: #0366d6;
            font-size: 1.4rem;
        }
        .card p {
            color: #586069;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>
        <p class="subtitle">Please select a section below to continue:</p>
        
        <div class="card-grid">
            <!-- Option 1: Financial Analysis -->
            <a href="finance.html" class="card">
                <h2>Financial Analysis</h2>
                <p>Access your investment tracker, monitor bank accounts, view monthly expenses, and review income projections.</p>
            </a>

            <!-- Option 2: Second Page -->
            <a href="other-page.html" class="card">
                <h2>Better yet</h2>
                <p>Something much better than finances:  the concept of Grace through Faith.</p>
            </a>
        </div>
    </div>

</body>
</html>
